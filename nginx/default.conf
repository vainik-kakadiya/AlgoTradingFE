# Single public entry point: serves the built React app and proxies the API and
# WebSocket to the backend container, so the browser talks to one origin (no CORS).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Extra brute-force protection for the login endpoint (the backend also locks out an IP
# after 5 failed attempts in 15 minutes).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Login is enforced by the backend: every /api, /ws and /docs request needs a session
    # cookie. The static app files themselves contain no data.

    root  /usr/share/nginx/html;
    index index.html;

    # CSV dataset imports can be large.
    client_max_body_size 200m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Container health check (no login, no logging).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # X-Forwarded-For is *set* to the real client address (not appended to), so a client
    # cannot spoof its IP to dodge the login lock-out.

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @login_throttled;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same JSON error shape as the backend, so the login page can show a proper message.
    location @login_throttled {
        default_type application/json;
        return 429 '{"error":{"code":"TOO_MANY_ATTEMPTS","message":"Too many login attempts. Wait a few minutes and try again.","details":null}}';
    }

    # REST API (also serves the Kite login callback /api/kite/callback).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Live updates WebSocket.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # FastAPI interactive docs.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Hashed build assets never change: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html; never cache it.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
